name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      # Both Go modules and the frontend are checked on the deployment platform.
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.mod
          cache-dependency-path: |
            services/go/go.sum
            apps/context/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7

      # Active CI covers the Go CLI, frontend and Go services, including
      # the current SQLite/Turso snapshot and migration tooling.
      - name: Run active CI checks
        run: bash scripts/ci.sh
